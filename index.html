<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
    }

    .gallery {
      column-count: 3;
      column-gap: 1rem;
      padding: 0 1rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      break-inside: avoid;
      background: #161616;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 1px solid #222;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #444; }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      background: #1a1a1a;
    }

    .card-body {
      padding: 0.85rem 1rem;
    }

    .card-body .prompt {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #ccc;
    }

    .card-body .date {
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.4rem;
    }

    .error {
      text-align: center;
      padding: 4rem 1rem;
      color: #888;
    }

    @media (max-width: 900px)  { .gallery { column-count: 2; } }
    @media (max-width: 520px)  { .gallery { column-count: 1; max-width: 480px; } }
  </style>
</head>
<body>
  <header><h1>Image Gallery</h1></header>
  <div class="gallery" id="gallery"></div>

  <script>
    function formatDate(iso) {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function createCard(entry) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<img src="' + entry.url + '" alt="' + entry.prompt.replace(/"/g, '&quot;') + '" loading="lazy">' +
        '<div class="card-body">' +
          '<p class="prompt">' + entry.prompt + '</p>' +
          '<p class="date">' + formatDate(entry.timestamp) + '</p>' +
        '</div>';
      return card;
    }

    fetch('images.json')
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (images) {
        var gallery = document.getElementById('gallery');
        images.forEach(function (entry) {
          gallery.appendChild(createCard(entry));
        });
      })
      .catch(function () {
        document.getElementById('gallery').innerHTML =
          '<p class="error">Could not load images.json</p>';
      });
  </script>
</body>
</html>
